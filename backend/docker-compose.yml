version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    container_name: zoho-desk-postgres
    environment:
      POSTGRES_DB: zoho_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/migrations:/docker-entrypoint-initdb.d
    networks:
      - zoho-desk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: zoho-desk-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: zoho_desk
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongo/migrations:/docker-entrypoint-initdb.d
    networks:
      - zoho-desk-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: zoho-desk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zoho-desk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: zoho-desk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - zoho-desk-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monolith Application
  zoho-desk-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoho-desk-monolith
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      
      # Database URLs
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/zoho_desk
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017/zoho_desk?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      
      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-prod
      JWT_EXPIRES_IN: 24h
      REFRESH_TOKEN_SECRET: your-super-secret-refresh-key-prod
      REFRESH_TOKEN_EXPIRES_IN: 7d
      
      # Frontend URL
      FRONTEND_URL: http://localhost:3000
      
      # Integration API Keys (set these in production)
      SENDGRID_API_KEY: your-sendgrid-api-key
      TWILIO_ACCOUNT_SID: your-twilio-account-sid
      TWILIO_AUTH_TOKEN: your-twilio-auth-token
      
      # Logging
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - zoho-desk-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: zoho-desk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - zoho-desk-monolith
    networks:
      - zoho-desk-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  zoho-desk-network:
    driver: bridge