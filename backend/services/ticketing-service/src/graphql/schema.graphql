# GraphQL Schema for Ticketing Service

type Ticket {
  id: ID!
  title: String!
  description: String!
  status: String!
  priority: String!
  departmentId: String!
  assigneeId: String!
  tenantId: String!
  createdAt: String!
  updatedAt: String!
  closedAt: String
  attachments: [String!]!
  rating: Float
  assignee: User
  department: Department
  comments: [Comment!]!
}

type Comment {
  id: ID!
  ticketId: String!
  userId: String!
  comment: String!
  attachments: [String!]!
  createdAt: String!
  updatedAt: String!
  user: User
}

type Department {
  id: ID!
  name: String!
  description: String!
  tenantId: String!
  createdAt: String!
  updatedAt: String!
  tickets: [Ticket!]!
}

type Workflow {
  id: ID!
  name: String!
  description: String!
  rules: String!
  tenantId: String!
  createdAt: String!
  updatedAt: String!
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  role: String!
}

type TicketsResponse {
  tickets: [Ticket!]!
  total: Int!
  page: Int!
  limit: Int!
}

type CommentsResponse {
  comments: [Comment!]!
  total: Int!
  page: Int!
  limit: Int!
}

type DepartmentsResponse {
  departments: [Department!]!
  total: Int!
  page: Int!
  limit: Int!
}

type WorkflowsResponse {
  workflows: [Workflow!]!
  total: Int!
  page: Int!
  limit: Int!
}

type DeleteResponse {
  success: Boolean!
  message: String!
}

type ExecuteWorkflowResponse {
  success: Boolean!
  message: String!
  result: String!
}

# Input Types
input CreateTicketInput {
  title: String!
  description: String!
  priority: String!
  departmentId: String!
  assigneeId: String
  tenantId: String!
  attachments: [String!]
}

input UpdateTicketInput {
  title: String
  description: String
  status: String
  priority: String
  departmentId: String
  assigneeId: String
  attachments: [String!]
}

input CreateCommentInput {
  ticketId: String!
  userId: String!
  comment: String!
  attachments: [String!]
}

input UpdateCommentInput {
  comment: String!
  attachments: [String!]
}

input CreateDepartmentInput {
  name: String!
  description: String!
  tenantId: String!
}

input UpdateDepartmentInput {
  name: String
  description: String
}

input CreateWorkflowInput {
  name: String!
  description: String!
  rules: String!
  tenantId: String!
}

input UpdateWorkflowInput {
  name: String
  description: String
  rules: String
}

input ListTicketsInput {
  tenantId: String!
  status: String
  priority: String
  departmentId: String
  assigneeId: String
  page: Int = 1
  limit: Int = 10
  dateFrom: String
  dateTo: String
}

input ListCommentsInput {
  ticketId: String!
  page: Int = 1
  limit: Int = 10
}

input ListDepartmentsInput {
  tenantId: String!
  page: Int = 1
  limit: Int = 10
}

input ListWorkflowsInput {
  tenantId: String!
  page: Int = 1
  limit: Int = 10
}

input AssignTicketInput {
  ticketId: String!
  assigneeId: String!
  tenantId: String!
}

input ChangeStatusInput {
  ticketId: String!
  status: String!
  tenantId: String!
}

input ExecuteWorkflowInput {
  workflowId: String!
  ticketId: String!
  tenantId: String!
}

# Queries
type Query {
  # Ticket Queries
  getTicket(id: ID!, tenantId: String!): Ticket
  listTickets(input: ListTicketsInput!): TicketsResponse!
  
  # Comment Queries
  getComment(id: ID!): Comment
  listComments(input: ListCommentsInput!): CommentsResponse!
  
  # Department Queries
  getDepartment(id: ID!, tenantId: String!): Department
  listDepartments(input: ListDepartmentsInput!): DepartmentsResponse!
  
  # Workflow Queries
  getWorkflow(id: ID!, tenantId: String!): Workflow
  listWorkflows(input: ListWorkflowsInput!): WorkflowsResponse!
}

# Mutations
type Mutation {
  # Ticket Mutations
  createTicket(input: CreateTicketInput!): Ticket!
  updateTicket(id: ID!, input: UpdateTicketInput!): Ticket!
  deleteTicket(id: ID!, tenantId: String!): DeleteResponse!
  assignTicket(input: AssignTicketInput!): Ticket!
  changeStatus(input: ChangeStatusInput!): Ticket!
  
  # Comment Mutations
  createComment(input: CreateCommentInput!): Comment!
  updateComment(id: ID!, input: UpdateCommentInput!): Comment!
  deleteComment(id: ID!): DeleteResponse!
  
  # Department Mutations
  createDepartment(input: CreateDepartmentInput!): Department!
  updateDepartment(id: ID!, tenantId: String!, input: UpdateDepartmentInput!): Department!
  deleteDepartment(id: ID!, tenantId: String!): DeleteResponse!
  
  # Workflow Mutations
  createWorkflow(input: CreateWorkflowInput!): Workflow!
  updateWorkflow(id: ID!, input: UpdateWorkflowInput!): Workflow!
  deleteWorkflow(id: ID!, tenantId: String!): DeleteResponse!
  executeWorkflow(input: ExecuteWorkflowInput!): ExecuteWorkflowResponse!
}

# Subscriptions (for real-time updates)
type Subscription {
  ticketCreated(tenantId: String!): Ticket!
  ticketUpdated(tenantId: String!): Ticket!
  ticketDeleted(tenantId: String!): ID!
  ticketAssigned(tenantId: String!): Ticket!
  ticketStatusChanged(tenantId: String!): Ticket!
  
  commentCreated(ticketId: String!): Comment!
  commentUpdated(ticketId: String!): Comment!
  commentDeleted(ticketId: String!): ID!
  
  departmentCreated(tenantId: String!): Department!
  departmentUpdated(tenantId: String!): Department!
  departmentDeleted(tenantId: String!): ID!
  
  workflowCreated(tenantId: String!): Workflow!
  workflowUpdated(tenantId: String!): Workflow!
  workflowDeleted(tenantId: String!): ID!
  workflowExecuted(tenantId: String!): ExecuteWorkflowResponse!
} 