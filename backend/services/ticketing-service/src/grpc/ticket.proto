syntax = "proto3";

package ticketing;

// Ticket Service
service TicketService {
  rpc GetTicket(GetTicketRequest) returns (TicketResponse);
  rpc CreateTicket(CreateTicketRequest) returns (TicketResponse);
  rpc UpdateTicket(UpdateTicketRequest) returns (TicketResponse);
  rpc DeleteTicket(DeleteTicketRequest) returns (DeleteTicketResponse);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);
  rpc AssignTicket(AssignTicketRequest) returns (TicketResponse);
  rpc ChangeStatus(ChangeStatusRequest) returns (TicketResponse);
}

// Comment Service
service CommentService {
  rpc GetComment(GetCommentRequest) returns (CommentResponse);
  rpc CreateComment(CreateCommentRequest) returns (CommentResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (CommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
}

// Department Service
service DepartmentService {
  rpc GetDepartment(GetDepartmentRequest) returns (DepartmentResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (DepartmentResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (DepartmentResponse);
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
}

// Workflow Service
service WorkflowService {
  rpc GetWorkflow(GetWorkflowRequest) returns (WorkflowResponse);
  rpc CreateWorkflow(CreateWorkflowRequest) returns (WorkflowResponse);
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (WorkflowResponse);
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (DeleteWorkflowResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc ExecuteWorkflow(ExecuteWorkflowRequest) returns (ExecuteWorkflowResponse);
}

// Ticket Messages
message Ticket {
  string id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  string priority = 5;
  string departmentId = 6;
  string assigneeId = 7;
  string tenantId = 8;
  string createdAt = 9;
  string updatedAt = 10;
  string closedAt = 11;
  repeated string attachments = 12;
  double rating = 13;
}

message GetTicketRequest {
  string id = 1;
  string tenantId = 2;
}

message CreateTicketRequest {
  string title = 1;
  string description = 2;
  string priority = 3;
  string departmentId = 4;
  string assigneeId = 5;
  string tenantId = 6;
  repeated string attachments = 7;
}

message UpdateTicketRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  string priority = 5;
  string departmentId = 6;
  string assigneeId = 7;
  string tenantId = 8;
  repeated string attachments = 9;
}

message DeleteTicketRequest {
  string id = 1;
  string tenantId = 2;
}

message DeleteTicketResponse {
  bool success = 1;
  string message = 2;
}

message ListTicketsRequest {
  string tenantId = 1;
  string status = 2;
  string priority = 3;
  string departmentId = 4;
  string assigneeId = 5;
  int32 page = 6;
  int32 limit = 7;
  string dateFrom = 8;
  string dateTo = 9;
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message AssignTicketRequest {
  string ticketId = 1;
  string assigneeId = 2;
  string tenantId = 3;
}

message ChangeStatusRequest {
  string ticketId = 1;
  string status = 2;
  string tenantId = 3;
}

message TicketResponse {
  Ticket ticket = 1;
  string error = 2;
}

// Comment Messages
message Comment {
  string id = 1;
  string ticketId = 2;
  string userId = 3;
  string comment = 4;
  repeated string attachments = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

message GetCommentRequest {
  string id = 1;
}

message CreateCommentRequest {
  string ticketId = 1;
  string userId = 2;
  string comment = 3;
  repeated string attachments = 4;
}

message UpdateCommentRequest {
  string id = 1;
  string comment = 2;
  repeated string attachments = 3;
}

message DeleteCommentRequest {
  string id = 1;
}

message DeleteCommentResponse {
  bool success = 1;
  string message = 2;
}

message ListCommentsRequest {
  string ticketId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message CommentResponse {
  Comment comment = 1;
  string error = 2;
}

// Department Messages
message Department {
  string id = 1;
  string name = 2;
  string description = 3;
  string tenantId = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message GetDepartmentRequest {
  string id = 1;
  string tenantId = 2;
}

message CreateDepartmentRequest {
  string name = 1;
  string description = 2;
  string tenantId = 3;
}

message UpdateDepartmentRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string tenantId = 4;
}

message DeleteDepartmentRequest {
  string id = 1;
  string tenantId = 2;
}

message DeleteDepartmentResponse {
  bool success = 1;
  string message = 2;
}

message ListDepartmentsRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListDepartmentsResponse {
  repeated Department departments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message DepartmentResponse {
  Department department = 1;
  string error = 2;
}

// Workflow Messages
message Workflow {
  string id = 1;
  string name = 2;
  string description = 3;
  string rules = 4;
  string tenantId = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

message GetWorkflowRequest {
  string id = 1;
  string tenantId = 2;
}

message CreateWorkflowRequest {
  string name = 1;
  string description = 2;
  string rules = 3;
  string tenantId = 4;
}

message UpdateWorkflowRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string rules = 4;
  string tenantId = 5;
}

message DeleteWorkflowRequest {
  string id = 1;
  string tenantId = 2;
}

message DeleteWorkflowResponse {
  bool success = 1;
  string message = 2;
}

message ListWorkflowsRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ExecuteWorkflowRequest {
  string workflowId = 1;
  string ticketId = 2;
  string tenantId = 3;
}

message ExecuteWorkflowResponse {
  bool success = 1;
  string message = 2;
  string result = 3;
}

message WorkflowResponse {
  Workflow workflow = 1;
  string error = 2;
} 