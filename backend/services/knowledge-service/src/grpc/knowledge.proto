syntax = "proto3";

package knowledge;

// Article Service
service ArticleService {
  rpc GetArticle(GetArticleRequest) returns (ArticleResponse);
  rpc CreateArticle(CreateArticleRequest) returns (ArticleResponse);
  rpc UpdateArticle(UpdateArticleRequest) returns (ArticleResponse);
  rpc DeleteArticle(DeleteArticleRequest) returns (DeleteArticleResponse);
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse);
  rpc PublishArticle(PublishArticleRequest) returns (ArticleResponse);
  rpc UnpublishArticle(UnpublishArticleRequest) returns (ArticleResponse);
}

// Category Service
service CategoryService {
  rpc GetCategory(GetCategoryRequest) returns (CategoryResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc GetCategoryTree(GetCategoryTreeRequest) returns (CategoryTreeResponse);
}

// Search Service
service SearchService {
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse);
  rpc SearchByCategory(SearchByCategoryRequest) returns (SearchArticlesResponse);
  rpc GetPopularArticles(GetPopularArticlesRequest) returns (ListArticlesResponse);
  rpc GetRelatedArticles(GetRelatedArticlesRequest) returns (ListArticlesResponse);
}

// Article Messages
message Article {
  string id = 1;
  string title = 2;
  string content = 3;
  string summary = 4;
  string categoryId = 5;
  string authorId = 6;
  string tenantId = 7;
  bool isPublished = 8;
  repeated string tags = 9;
  repeated string attachments = 10;
  int32 viewCount = 11;
  double rating = 12;
  string createdAt = 13;
  string updatedAt = 14;
  string publishedAt = 15;
}

message GetArticleRequest {
  string id = 1;
  string tenantId = 2;
}

message CreateArticleRequest {
  string title = 1;
  string content = 2;
  string summary = 3;
  string categoryId = 4;
  string authorId = 5;
  string tenantId = 6;
  repeated string tags = 7;
  repeated string attachments = 8;
}

message UpdateArticleRequest {
  string id = 1;
  string title = 2;
  string content = 3;
  string summary = 4;
  string categoryId = 5;
  repeated string tags = 6;
  repeated string attachments = 7;
  string tenantId = 8;
}

message DeleteArticleRequest {
  string id = 1;
  string tenantId = 2;
}

message DeleteArticleResponse {
  bool success = 1;
  string message = 2;
}

message ListArticlesRequest {
  string tenantId = 1;
  string categoryId = 2;
  string authorId = 3;
  bool isPublished = 4;
  repeated string tags = 5;
  int32 page = 6;
  int32 limit = 7;
  string sortBy = 8;
  string sortOrder = 9;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message PublishArticleRequest {
  string id = 1;
  string tenantId = 2;
}

message UnpublishArticleRequest {
  string id = 1;
  string tenantId = 2;
}

message ArticleResponse {
  Article article = 1;
  string error = 2;
}

// Category Messages
message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  string parentId = 4;
  string tenantId = 5;
  int32 order = 6;
  bool isActive = 7;
  string createdAt = 8;
  string updatedAt = 9;
}

message GetCategoryRequest {
  string id = 1;
  string tenantId = 2;
}

message CreateCategoryRequest {
  string name = 1;
  string description = 2;
  string parentId = 3;
  string tenantId = 4;
  int32 order = 5;
}

message UpdateCategoryRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string parentId = 4;
  int32 order = 5;
  bool isActive = 6;
  string tenantId = 7;
}

message DeleteCategoryRequest {
  string id = 1;
  string tenantId = 2;
}

message DeleteCategoryResponse {
  bool success = 1;
  string message = 2;
}

message ListCategoriesRequest {
  string tenantId = 1;
  string parentId = 2;
  bool isActive = 3;
  int32 page = 4;
  int32 limit = 5;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message CategoryNode {
  Category category = 1;
  repeated CategoryNode children = 2;
  int32 articleCount = 3;
}

message GetCategoryTreeRequest {
  string tenantId = 1;
  bool includeArticleCount = 2;
}

message CategoryTreeResponse {
  repeated CategoryNode categories = 1;
  string error = 2;
}

message CategoryResponse {
  Category category = 1;
  string error = 2;
}

// Search Messages
message SearchArticlesRequest {
  string query = 1;
  string tenantId = 2;
  string categoryId = 3;
  repeated string tags = 4;
  bool isPublished = 5;
  int32 page = 6;
  int32 limit = 7;
  string sortBy = 8;
  string sortOrder = 9;
}

message SearchArticlesResponse {
  repeated Article articles = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  double searchTime = 5;
  repeated string suggestions = 6;
}

message SearchByCategoryRequest {
  string categoryId = 1;
  string tenantId = 2;
  int32 page = 3;
  int32 limit = 4;
  string sortBy = 5;
  string sortOrder = 6;
}

message GetPopularArticlesRequest {
  string tenantId = 1;
  int32 limit = 2;
  string period = 3; // daily, weekly, monthly
}

message GetRelatedArticlesRequest {
  string articleId = 1;
  string tenantId = 2;
  int32 limit = 3;
} 