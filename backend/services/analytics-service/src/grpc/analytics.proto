syntax = "proto3";

package analytics;

// Analytics Service
service AnalyticsService {
  rpc GetTicketStats(GetTicketStatsRequest) returns (GetTicketStatsResponse);
  rpc GetSLACompliance(GetSLAComplianceRequest) returns (GetSLAComplianceResponse);
  rpc GetAgentPerformance(GetAgentPerformanceRequest) returns (GetAgentPerformanceResponse);
  rpc ExportAnalyticsReport(ExportAnalyticsReportRequest) returns (ExportAnalyticsReportResponse);
}

// Report Service
service ReportService {
  rpc GetTicketCount(GetTicketCountRequest) returns (GetTicketCountResponse);
  rpc GetAvgSLAResponseTime(GetAvgSLAResponseTimeRequest) returns (GetAvgSLAResponseTimeResponse);
  rpc GetAgentPerformanceReport(GetAgentPerformanceReportRequest) returns (GetAgentPerformanceReportResponse);
  rpc GenerateCustomReport(GenerateCustomReportRequest) returns (GenerateCustomReportResponse);
}

// Dashboard Service
service DashboardService {
  rpc GetTicketTrends(GetTicketTrendsRequest) returns (GetTicketTrendsResponse);
  rpc GetSLAComplianceDashboard(GetSLAComplianceDashboardRequest) returns (GetSLAComplianceDashboardResponse);
  rpc GetAgentStats(GetAgentStatsRequest) returns (GetAgentStatsResponse);
  rpc GetDashboardOverview(GetDashboardOverviewRequest) returns (GetDashboardOverviewResponse);
}

// Analytics Messages
message TicketStats {
  int32 volume = 1;
  double avgResolutionTime = 2;
  int32 breachCount = 3;
  double satisfactionScore = 4;
  string period = 5;
}

message GetTicketStatsRequest {
  string tenantId = 1;
  string dateFrom = 2;
  string dateTo = 3;
  string departmentId = 4;
}

message GetTicketStatsResponse {
  TicketStats stats = 1;
  string error = 2;
}

message SLACompliance {
  double complianceRate = 1;
  int32 totalTickets = 2;
  int32 compliantTickets = 3;
  int32 breachedTickets = 4;
  double avgResponseTime = 5;
  double avgResolutionTime = 6;
}

message GetSLAComplianceRequest {
  string tenantId = 1;
  string dateFrom = 2;
  string dateTo = 3;
}

message GetSLAComplianceResponse {
  SLACompliance compliance = 1;
  string error = 2;
}

message AgentPerformance {
  string agentId = 1;
  string agentName = 2;
  int32 ticketsHandled = 3;
  double avgRating = 4;
  double avgResolutionTime = 5;
  int32 slaBreaches = 6;
  double satisfactionScore = 7;
}

message GetAgentPerformanceRequest {
  string tenantId = 1;
  string agentId = 2;
  string dateFrom = 3;
  string dateTo = 4;
}

message GetAgentPerformanceResponse {
  repeated AgentPerformance agents = 1;
  string error = 2;
}

message ExportAnalyticsReportRequest {
  string type = 1; // csv, json, pdf
  string tenantId = 2;
  string dateFrom = 3;
  string dateTo = 4;
  repeated string filters = 5;
}

message ExportAnalyticsReportResponse {
  string reportUrl = 1;
  string reportId = 2;
  string status = 3;
  string error = 4;
}

// Report Messages
message TicketCount {
  int32 total = 1;
  int32 open = 2;
  int32 closed = 3;
  int32 pending = 4;
  string period = 5;
}

message GetTicketCountRequest {
  string tenantId = 1;
  string dateFrom = 2;
  string dateTo = 3;
  string status = 4;
}

message GetTicketCountResponse {
  TicketCount count = 1;
  string error = 2;
}

message SLAResponseTime {
  double avgResponseTime = 1;
  double avgResolutionTime = 2;
  int32 totalTickets = 3;
  string period = 4;
}

message GetAvgSLAResponseTimeRequest {
  string tenantId = 1;
  string dateFrom = 2;
  string dateTo = 3;
}

message GetAvgSLAResponseTimeResponse {
  SLAResponseTime responseTime = 1;
  string error = 2;
}

message AgentPerformanceReport {
  string agentId = 1;
  string agentName = 2;
  int32 totalTickets = 3;
  int32 resolvedTickets = 4;
  double avgRating = 5;
  double avgResolutionTime = 6;
  int32 slaBreaches = 7;
  double satisfactionScore = 8;
  string period = 9;
}

message GetAgentPerformanceReportRequest {
  string tenantId = 1;
  string agentId = 2;
  string dateFrom = 3;
  string dateTo = 4;
}

message GetAgentPerformanceReportResponse {
  AgentPerformanceReport report = 1;
  string error = 2;
}

message CustomReport {
  string reportId = 1;
  string name = 2;
  string type = 3;
  string data = 4;
  string tenantId = 5;
  string createdAt = 6;
}

message GenerateCustomReportRequest {
  string name = 1;
  string type = 2;
  repeated string metrics = 3;
  repeated string filters = 4;
  string tenantId = 5;
  string dateFrom = 6;
  string dateTo = 7;
}

message GenerateCustomReportResponse {
  CustomReport report = 1;
  string error = 2;
}

// Dashboard Messages
message TicketTrend {
  string date = 1;
  int32 count = 2;
  string status = 3;
}

message GetTicketTrendsRequest {
  string tenantId = 1;
  string period = 2; // daily, weekly, monthly
  int32 days = 3;
}

message GetTicketTrendsResponse {
  repeated TicketTrend trends = 1;
  string error = 2;
}

message SLAComplianceDashboard {
  double overallCompliance = 1;
  repeated SLACompliance byDepartment = 2;
  repeated SLACompliance byPeriod = 3;
  string period = 4;
}

message GetSLAComplianceDashboardRequest {
  string tenantId = 1;
  string period = 2;
  int32 days = 3;
}

message GetSLAComplianceDashboardResponse {
  SLAComplianceDashboard dashboard = 1;
  string error = 2;
}

message AgentStats {
  int32 totalAgents = 1;
  int32 activeAgents = 2;
  double avgPerformance = 3;
  repeated AgentPerformance topPerformers = 4;
  string period = 5;
}

message GetAgentStatsRequest {
  string tenantId = 1;
  string period = 2;
  int32 limit = 3;
}

message GetAgentStatsResponse {
  AgentStats stats = 1;
  string error = 2;
}

message DashboardOverview {
  TicketStats ticketStats = 1;
  SLACompliance slaCompliance = 2;
  AgentStats agentStats = 3;
  repeated TicketTrend recentTrends = 4;
  string period = 5;
}

message GetDashboardOverviewRequest {
  string tenantId = 1;
  string period = 2;
}

message GetDashboardOverviewResponse {
  DashboardOverview overview = 1;
  string error = 2;
} 