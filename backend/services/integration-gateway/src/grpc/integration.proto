syntax = "proto3";

package integration;

// Email Service
service EmailService {
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc SendBulkEmail(SendBulkEmailRequest) returns (SendBulkEmailResponse);
  rpc GetEmailStatus(GetEmailStatusRequest) returns (GetEmailStatusResponse);
  rpc GetEmailHistory(GetEmailHistoryRequest) returns (GetEmailHistoryResponse);
}

// SMS Service
service SMSService {
  rpc SendSMS(SendSMSRequest) returns (SendSMSResponse);
  rpc SendBulkSMS(SendBulkSMSRequest) returns (SendBulkSMSResponse);
  rpc GetSMSStatus(GetSMSStatusRequest) returns (GetSMSStatusResponse);
  rpc GetSMSHistory(GetSMSHistoryRequest) returns (GetSMSHistoryResponse);
}

// Chat Service
service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse);
  rpc JoinChat(JoinChatRequest) returns (JoinChatResponse);
  rpc LeaveChat(LeaveChatRequest) returns (LeaveChatResponse);
  rpc GetOnlineUsers(GetOnlineUsersRequest) returns (GetOnlineUsersResponse);
}

// Webhook Service
service WebhookService {
  rpc SendWebhook(SendWebhookRequest) returns (SendWebhookResponse);
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);
  rpc UnregisterWebhook(UnregisterWebhookRequest) returns (UnregisterWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc GetWebhookHistory(GetWebhookHistoryRequest) returns (GetWebhookHistoryResponse);
}

// Email Messages
message EmailMessage {
  string id = 1;
  string from = 2;
  repeated string to = 3;
  repeated string cc = 4;
  repeated string bcc = 5;
  string subject = 6;
  string body = 7;
  string htmlBody = 8;
  repeated string attachments = 9;
  string tenantId = 10;
  string status = 11;
  string createdAt = 12;
  string sentAt = 13;
}

message SendEmailRequest {
  string from = 1;
  repeated string to = 2;
  repeated string cc = 3;
  repeated string bcc = 4;
  string subject = 5;
  string body = 6;
  string htmlBody = 7;
  repeated string attachments = 8;
  string tenantId = 9;
}

message SendEmailResponse {
  EmailMessage email = 1;
  string error = 2;
}

message SendBulkEmailRequest {
  string from = 1;
  repeated string to = 2;
  string subject = 3;
  string body = 4;
  string htmlBody = 5;
  repeated string attachments = 6;
  string tenantId = 7;
}

message SendBulkEmailResponse {
  repeated EmailMessage emails = 1;
  int32 successCount = 2;
  int32 failureCount = 3;
  string error = 4;
}

message GetEmailStatusRequest {
  string emailId = 1;
  string tenantId = 2;
}

message GetEmailStatusResponse {
  string status = 1;
  string error = 2;
}

message GetEmailHistoryRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;
  string dateFrom = 5;
  string dateTo = 6;
}

message GetEmailHistoryResponse {
  repeated EmailMessage emails = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// SMS Messages
message SMSMessage {
  string id = 1;
  string from = 2;
  string to = 3;
  string message = 4;
  string tenantId = 5;
  string status = 6;
  string createdAt = 7;
  string sentAt = 8;
}

message SendSMSRequest {
  string from = 1;
  string to = 2;
  string message = 3;
  string tenantId = 4;
}

message SendSMSResponse {
  SMSMessage sms = 1;
  string error = 2;
}

message SendBulkSMSRequest {
  string from = 1;
  repeated string to = 2;
  string message = 3;
  string tenantId = 4;
}

message SendBulkSMSResponse {
  repeated SMSMessage sms = 1;
  int32 successCount = 2;
  int32 failureCount = 3;
  string error = 4;
}

message GetSMSStatusRequest {
  string smsId = 1;
  string tenantId = 2;
}

message GetSMSStatusResponse {
  string status = 1;
  string error = 2;
}

message GetSMSHistoryRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;
  string dateFrom = 5;
  string dateTo = 6;
}

message GetSMSHistoryResponse {
  repeated SMSMessage sms = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// Chat Messages
message ChatMessage {
  string id = 1;
  string chatId = 2;
  string userId = 3;
  string message = 4;
  string messageType = 5;
  repeated string attachments = 6;
  string tenantId = 7;
  string createdAt = 8;
}

message SendMessageRequest {
  string chatId = 1;
  string userId = 2;
  string message = 3;
  string messageType = 4;
  repeated string attachments = 5;
  string tenantId = 6;
}

message SendMessageResponse {
  ChatMessage message = 1;
  string error = 2;
}

message GetChatHistoryRequest {
  string chatId = 1;
  string tenantId = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetChatHistoryResponse {
  repeated ChatMessage messages = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message JoinChatRequest {
  string chatId = 1;
  string userId = 2;
  string tenantId = 3;
}

message JoinChatResponse {
  bool success = 1;
  string error = 2;
}

message LeaveChatRequest {
  string chatId = 1;
  string userId = 2;
  string tenantId = 3;
}

message LeaveChatResponse {
  bool success = 1;
  string error = 2;
}

message GetOnlineUsersRequest {
  string chatId = 1;
  string tenantId = 2;
}

message GetOnlineUsersResponse {
  repeated string userIds = 1;
  int32 count = 2;
  string error = 3;
}

// Webhook Messages
message Webhook {
  string id = 1;
  string name = 2;
  string url = 3;
  string method = 4;
  repeated string events = 5;
  string tenantId = 6;
  bool isActive = 7;
  string createdAt = 8;
  string updatedAt = 9;
}

message WebhookDelivery {
  string id = 1;
  string webhookId = 2;
  string event = 3;
  string payload = 4;
  string response = 5;
  int32 statusCode = 6;
  string tenantId = 7;
  string createdAt = 8;
}

message SendWebhookRequest {
  string webhookId = 1;
  string event = 2;
  string payload = 3;
  string tenantId = 4;
}

message SendWebhookResponse {
  WebhookDelivery delivery = 1;
  string error = 2;
}

message RegisterWebhookRequest {
  string name = 1;
  string url = 2;
  string method = 3;
  repeated string events = 4;
  string tenantId = 5;
}

message RegisterWebhookResponse {
  Webhook webhook = 1;
  string error = 2;
}

message UnregisterWebhookRequest {
  string webhookId = 1;
  string tenantId = 2;
}

message UnregisterWebhookResponse {
  bool success = 1;
  string error = 2;
}

message ListWebhooksRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 limit = 3;
  bool isActive = 4;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetWebhookHistoryRequest {
  string webhookId = 1;
  string tenantId = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetWebhookHistoryResponse {
  repeated WebhookDelivery deliveries = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
} 